name: ad_scanner
description: "Visual Advertisement Scanner - Production-grade Flutter mobile application with OCR, AI extraction, and local lead management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  shared_preferences: ^2.3.2
  dio: ^5.7.0
  intl: ^0.19.0
  uuid: ^4.5.1
  share_plus: ^10.1.2
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
